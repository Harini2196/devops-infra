name: Terraform – DevSecOps Infra

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm_destroy:
        description: 'Type "destroy" to confirm a destroy run'
        type: string
        required: false

# Never run two Terraform jobs against the same state at once
concurrency:
  group: terraform-devsecops
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to assume the AWS role via GitHub OIDC

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: arn:aws:iam::211125304367:role/gh-actions-admin-role
  WORKDIR: terraform

jobs:
  # ------------------------------------------------------------------
  # 1. Lint + validate + plan  (every PR, push, and manual run)
  # ------------------------------------------------------------------
  plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Ansible syntax check
        working-directory: ansible
        run: |
          pipx install ansible-core
          for f in *.yml; do ansible-playbook --syntax-check -i localhost, "$f"; done

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show assumed identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'netflix-devsecops/terraform.tfstate' }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Write SSH private key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ec2.pem"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ec2.pem"

      - name: Terraform plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="private_key_path=$RUNNER_TEMP/ec2.pem" | tee plan.txt

      - name: Plan summary
        if: always()
        run: |
          {
            echo "## Terraform plan"
            echo '```'
            grep -E '^(Plan:|No changes|Changes to Outputs)' plan.txt || tail -n 20 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2.pem"

  # ------------------------------------------------------------------
  # 2. Apply  (push to main, or manual "apply")
  #    Re-plans in this job so the runner's own IP is allowed for SSH.
  #    Add required reviewers to the "production" environment for a manual gate.
  # ------------------------------------------------------------------
  apply:
    name: Apply
    needs: plan
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show assumed identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'netflix-devsecops/terraform.tfstate' }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Write SSH private key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ec2.pem"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ec2.pem"

      - name: Get runner public IP
        id: ip
        run: echo "cidr=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')/32" >> "$GITHUB_OUTPUT"

      - name: Terraform plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="private_key_path=$RUNNER_TEMP/ec2.pem" \
            -var='extra_ssh_cidrs=["${{ steps.ip.outputs.cidr }}"]'

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        run: |
          {
            echo "## Deployed"
            echo '```json'
            terraform output -json urls
            echo
            terraform output -json dns_names
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2.pem"

  # ------------------------------------------------------------------
  # 3. Destroy  (manual only: Run workflow -> action=destroy, confirm="destroy")
  #    Add required reviewers to the "destroy" environment for a second approval.
  # ------------------------------------------------------------------
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm_destroy == 'destroy'
    environment: destroy
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}-${{ github.job }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show assumed identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY || 'netflix-devsecops/terraform.tfstate' }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Write SSH private key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/ec2.pem"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ec2.pem"

      - name: Terraform plan -destroy
        run: |
          terraform plan -destroy -no-color -out=destroy.tfplan \
            -var="private_key_path=$RUNNER_TEMP/ec2.pem" | tee destroy.txt
          grep -E '^Plan:' destroy.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Terraform destroy
        run: terraform apply -auto-approve destroy.tfplan

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/ec2.pem"